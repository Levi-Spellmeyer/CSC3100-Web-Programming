<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body class="bg-dark">
    <form id="signup" class="card col-12 col-md-6 offset-md-3 col-lg-4 offset-lg-4 mt-5">
        <div class="card-body">
            <h1 class="mb-0 text-center">SHEMR</h1> 
            <h3 class="mt-2 text-center">Registration Form</h3>   
            <hr class="mb-2 mt-3"/>
            <fieldset id="login-information" class="form control mt-2 mb-2">
                <input id="txtUsername" type="email" placeholder="jdoe@email.com" class="form-control">
                <input id="txtPassword" type="password" minlength="8" placeholder="password" class="form-control mt-2">
            </fieldset>
            <hr class="mb-2 mt-2"/>
            <fieldset id="user-info" class="form control mt-3">
                <input id="firstName" type="text" placeholder="First Name" class="form-control">
                <input id="middleName" type="text" placeholder="Middle Name" class="form-control mt-2">
                <input id="lastName" type="text" placeholder="Last Name" class="form-control mt-2">
                <input id="mobil-num" placeholder="Phone Number" class="form-control mt-2">
            </fieldset>
            <hr class="mb-1"/>
            <fieldset id="location" type="text" class="mt-2"">
                <input id="address1" type="text" placeholder="111 somewhere lane" class="form-control mt-2">
                <input id="address2" type="text" placeholder="123 somewhere else rd" class="form-control mt-2">
                <input id="city" type="text" placeholder="city" class="form-control mt-2">
                <input id="state" type="text" placeholder="State" class="form-control mt-2">
                <input id="zip" type="text" placeholder="zip code" class="form-control mt-2">
            </fieldset>
            <button type="button" class="btn btn-primary col-12 mt-4" id="btnSubmit">Submit</button>
        </div>
    </form >
    <form id="frmLogin" class="card col-12 col-md-6 offset-md-3 col-lg-4 offset-lg-4 mt-5" style="display:none;">
        <div class="card-body">
            <h1 class="mb-0 text-center text-primary">SHEMR</h1>
            <h3 class="mt-2 text-center">Sign in Page</h3>


        </div>
    </form>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.querySelector("#btnSubmit").addEventListener("click",(e) =>{
            const regEmail = /[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*@(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?/
            const regPassword = /^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$/;
            rd = /^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$ %^&*-]).{8,}$/
            let strUsername = document.querySelector("#txtUsername").value
            const strPassword = document.querySelector("#txtPassword").value
            strUsername = strUsername.toLowerCase()
            let blnError = false
            let strMessage = ""

            if(!regEmail.test(strUsername)){
                blnError = true
                strMessage += '<p class="mb-0 mt-0">Username must be a valid email address</p>'
            }

            if(!regPassword.test(strPassword)){
                blnError = true
                strMessage += '<p>Password must contain eight characters, at least one upper case English letter, one lower case English letter, one number and one special character</p>'
            }



            if(blnError){
                Swal.fire({
                title: "Oh no, you have an error!",
                html: strMessage,
                icon: "error"
            });
            } else {
                Swal.fire({
                    title: "Success!",
                    text: "Login credentials are valid.",
                    icon: "success"
                });                
            }
        })
         


    </script>




</body>
</html>
